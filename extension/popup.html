<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PastDow</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span class="brand"><img src="icons/32.png" alt="" width="22" height="22">PAST&amp;DOW</span> <button id="repair" class="link" hidden>CHANGE KEY</button></header>
<p id="connection" role="status"></p>
<nav role="tablist" aria-label="Downloads"><button id="foundTab" role="tab" aria-selected="true" aria-controls="items">FOUND</button><button id="historyTab" role="tab" aria-selected="false" aria-controls="history">HISTORY</button></nav>
<form id="pair"><label for="key">PAIRING KEY · FROM PASTDOW MENU</label><div><input id="key" type="password" autocomplete="off" placeholder="Paste the key"><button>PAIR</button></div></form>
<button id="force">FORCE DETECT</button>
<p id="status" role="status"></p><main id="items" role="tabpanel" aria-labelledby="foundTab"></main><main id="history" role="tabpanel" aria-labelledby="historyTab" hidden></main>
<footer id="foot">Videos also appear in PastDow's BROWSER tab, pick quality there</footer>
<script src="popup.js"></script></body></html>
